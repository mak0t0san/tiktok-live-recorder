# TikTok Live Recorder — TrueNAS Custom App
#
# Install: Apps -> Discover -> (kebab menu) -> Install via YAML, then paste
# this file. TrueNAS 25.10 and later require the top-level `services:` key.
#
# Before installing, create two datasets on a data pool and give them to the
# apps user (568). Put them anywhere you would keep your own data — NOT under
# <pool>/ix-apps, which TrueNAS manages itself:
#
#   zfs create <pool>/<parent>/tiktok-recorder-config
#   zfs create <pool>/<parent>/tiktok-recordings
#   chown 568:568 /mnt/<pool>/<parent>/tiktok-recorder-config \
#                 /mnt/<pool>/<parent>/tiktok-recordings
#
# Replace <owner>, <pool> and <parent> below, and change TLR_WEB_PASSWORD.
#
# Installing through the Custom App *form* instead? See the TrueNAS section of
# the README — there /config is better served by an ixVolume, which the form
# creates for you and this file cannot express.

services:
  tiktok-live-recorder:
    # `latest` exists only once a GitHub release is published; branch builds
    # are tagged with the branch name.
    image: ghcr.io/<owner>/tiktok-live-recorder:main
    container_name: tiktok-live-recorder
    restart: unless-stopped

    environment:
      # Dashboard login. Leave unset and the container logs a random one-off
      # password on every start.
      TLR_WEB_PASSWORD: change-me

      # TikTok session cookies (preferred). Alternatively paste them in the
      # web UI under Settings after first login.
      # TLR_SESSIONID_SS: "..."
      # TLR_TT_TARGET_IDC: useast8
      # TLR_MSTOKEN: "..."

      # 568 is TrueNAS SCALE's built-in `apps` user, so recordings land on the
      # dataset with sane ownership.
      PUID: "568"
      PGID: "568"
      TZ: America/Los_Angeles

      # Re-encode to a single resolution so TikTok's mid-stream resolution
      # changes don't make playback shrink and grow. Costs CPU; set "false"
      # to stream-copy instead.
      TLR_SCALE: "true"

      # Optional:
      # TLR_INTERVAL: "5"          # minutes between liveness checks
      # TLR_PROXY: http://host:8080
      # TLR_TELEGRAM: "false"      # needs telegram.json filled in on /config

    ports:
      - "8000:8000"

    volumes:
      # Optional telegram.json (+ legacy cookies.json). Small.
      - /mnt/<pool>/<parent>/tiktok-recorder-config:/config
      # Working directory: recordings/, the status SQLite DB and the log.
      # Keep this on a normal dataset you can share and snapshot on its own
      # schedule — it grows with every recording. It must also be a local
      # ZFS path: the status DB runs SQLite in WAL mode and will corrupt on
      # an NFS or SMB backed mount.
      - /mnt/<pool>/<parent>/tiktok-recordings:/data

    # Live-preview HLS segments are written to a temp dir. Keeping them in RAM
    # avoids constant small writes to the pool.
    tmpfs:
      - /tmp:size=2g

    # Recordings finish converting flv->mp4 on shutdown; give that room.
    stop_grace_period: 60s
